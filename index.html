                      <h4 className="text-sm font-bold text-[#2A231F]">極致手沖藝廊</h4>

                <div className="w-12 h-0.5 bg-[#8C6D53] mx-auto mt-4"></div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                {[
                  {
                    icon: "coffee",
                    title: "匠心手沖",
                    desc: "我們親自拜訪合作莊園，揀選品質卓越的單品生豆。每一杯手沖都經過精確的水溫與沖煮比計算，綻放最純粹的風土韻味。"

                  {
                    icon: "heart",
                    title: "手作限定",
                    desc: "甜點廚房堅持每日現做，嚴選法國伊斯尼奶油與日本靜岡抹茶。不使用人工添加物，讓美好的甜意自然回甘。"
                  },
                  {
                    icon: "sparkles",
                    title: "沉浸空間",
                    desc: "空間設計結合溫暖木質與暖色柔光，每個座位均貼心設有充電插座與適宜的高度，不管是個人閱讀或好友聚會都極為舒適。"
                  }
                ].map((card, idx) => (
                  <div

                    className="scroll-reveal opacity-0 translate-y-10 transition-all duration-700 bg-[#FDFBF7] p-8 rounded-2xl shadow-sm border border-[#EAE3D9] hover:shadow-xl hover:-translate-y-2 group"

                    <p className="text-sm text-[#6E5D53] leading-relaxed">
                      {card.desc}
                    </p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* 4. 空間視覺圖庫 Gallery Section */}
          <section id="gallery" className="py-24 px-6 md:px-12">
            <div className="max-w-6xl mx-auto">
              <div className="scroll-reveal opacity-0 translate-y-10 transition-all duration-700 flex flex-col md:flex-row md:items-end justify-between mb-12">

                  <span className="text-xs font-bold tracking-widest text-[#8C6D53] uppercase">Gallery</span>

                <div className="flex flex-wrap gap-2 mt-6 md:mt-0">
                  {[
                    { id: 'all', label: '全部照片' },
                    { id: 'interior', label: '店內空間' },
                    { id: 'coffee', label: '手沖咖啡' },
                    { id: 'dessert', label: '手作甜點' }

                      key={tag.id}
                      onClick={() => setActiveGalleryTag(tag.id)}
                      className={`px-4 py-2 rounded-full text-xs font-medium transition-all duration-300 ${activeGalleryTag === tag.id ? 'bg-[#8C6D53] text-white shadow-md scale-105' : 'bg-[#F4EFEA] text-[#6E5D53] hover:bg-[#EAE3D9] hover:scale-105'}`}
                    >
                      {tag.label}
                    </button>

                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredGallery.map((item, index) => (
                  <div 
                    key={index} 
                    className="scroll-reveal opacity-0 translate-y-10 transition-all duration-500 group relative rounded-2xl overflow-hidden aspect-[4/3] bg-stone-200 shadow-sm border border-[#EAE3D9] hover:shadow-xl hover:-translate-y-1 cursor-pointer"
                    style={{ transitionDelay: `${(index % 3) * 100}ms` }}
                  >
                    <img 
                      src={item.img} 
                      alt={item.title} 
                      className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out"

                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent opacity-0 group-hover:opacity-100 transition-all duration-300 flex items-end p-6">
                      <span className="text-white font-medium text-base font-serif translate-y-4 group-hover:translate-y-0 transition-transform duration-300">

                      </span>
                    </div>

              </div>

          </section>

          {/* 5. 特色菜單 Menu Section */}
          <section id="menu" className="py-24 bg-[#F4EFEA] px-6 md:px-12">

              <div className="scroll-reveal opacity-0 translate-y-10 transition-all duration-700 text-center max-w-2xl mx-auto mb-12">
                <span className="text-xs font-bold tracking-widest text-[#8C6D53] uppercase">Menu Showcase</span>
                <h2 className="text-3xl sm:text-4xl font-serif font-bold text-[#2A231F] mt-2">日栖精選菜單</h2>
                <p className="text-sm text-[#6E5D53] mt-3">低消為每人一杯飲品，內用時間 120 分鐘。</p>
                <div className="w-12 h-0.5 bg-[#8C6D53] mx-auto mt-4"></div>
              </div>

              {/* 菜單分類切換 */}
              <div className="scroll-reveal opacity-0 translate-y-10 transition-all duration-700 flex justify-center gap-3 mb-12 overflow-x-auto pb-2">

                  <button
                    key={cat.id}
                    onClick={() => setActiveTab(cat.id)}
                    className={`px-6 py-2.5 rounded-full text-sm font-medium whitespace-nowrap transition-all duration-300 ${
                      activeTab === cat.id
                        ? 'bg-[#8C6D53] text-white shadow-md scale-105'
                        : 'bg-[#FDFBF7] text-[#6E5D53] border border-[#EAE3D9] hover:bg-[#EAE3D9] hover:scale-105'

                  >

                ))}
              </div>

              {/* 菜單卡片列表 */}

                {filteredMenuItems.map((item, idx) => (
                  <div 
                    key={item.id}
                    className="scroll-reveal opacity-0 translate-y-10 transition-all duration-500 bg-[#FDFBF7] rounded-2xl overflow-hidden shadow-sm border border-[#EAE3D9] hover:shadow-xl hover:-translate-y-2 transition-all duration-300 flex flex-col group"
                    style={{ transitionDelay: `${(idx % 3) * 100}ms` }}
                  >
                    <div className="relative h-48 overflow-hidden">
                      <img 
                        src={item.img} 
                        alt={item.name} 
                        className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out"
                      />
                      <span className="absolute top-4 right-4 px-3 py-1 bg-[#2A231F]/80 backdrop-blur-sm text-white text-xs font-medium rounded-full shadow-sm">
                        {item.tag}
                      </span>
                    </div>
                    <div className="p-6 flex-1 flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <h3 className="text-lg font-serif font-bold text-[#2A231F] group-hover:text-[#8C6D53] transition-colors">{item.name}</h3>
                          <span className="text-lg font-bold text-[#8C6D53]">NT$ {item.price}</span>
                        </div>
                        <p className="text-xs sm:text-sm text-[#6E5D53] leading-relaxed mt-2">
                          {item.desc}
                        </p>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* 6. 線上訂位 Booking Section */}
          <section id="booking" className="py-24 px-6 md:px-12 relative overflow-hidden">
            <div className="scroll-reveal opacity-0 translate-y-10 transition-all duration-700 max-w-4xl mx-auto bg-white rounded-3xl shadow-xl border border-[#EAE3D9] p-8 sm:p-12 relative">
              <div className="absolute top-0 right-0 w-40 h-40 bg-[#F4EFEA] rounded-full blur-2xl -z-10"></div>
              
              <div className="text-center max-w-xl mx-auto mb-10">
                <span className="text-xs font-bold tracking-widest text-[#8C6D53] uppercase">Table Reservation</span>
                <h2 className="text-3xl font-serif font-bold text-[#2A231F] mt-2">線上席次預約</h2>
                <p className="text-sm text-[#6E5D53] mt-2">預先為您保留溫暖座位，提早規劃恬靜午後時光。</p>
              </div>

              {bookingSubmitted ? (
                <div className="bg-[#F4EFEA] border border-[#D9C5B2] rounded-2xl p-8 text-center animate-[fadeIn_0.5s_ease-out]">
                  <div className="flex justify-center mb-4 text-[#8C6D53] animate-bounce">
                    <Icon name="checkCircle" className="w-16 h-16" />
                  </div>
                  <h3 className="text-2xl font-serif font-bold text-[#2A231F] mb-2">預約資訊已送出！</h3>
                  <p className="text-sm text-[#6E5D53] max-w-md mx-auto mb-4">

                  </p>

                    預約人：{booking.name} 先生/小姐 ｜ 時間：{booking.date} {booking.time} ({booking.guests}位)
                  </div>
                </div>
              ) : (
                <form onSubmit={handleBookingSubmit} className="space-y-6">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                      <label className="block text-xs font-bold text-[#2A231F] uppercase mb-2">訂位姓名 *</label>
                      <input 
                        type="text" 
                        required
                        placeholder="例如：王小明"
                        value={booking.name}
                        onChange={(e) => setBooking({...booking, name: e.target.value})}
                        className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-[#8C6D53]/50 text-sm bg-[#FDFBF7] transition-all duration-300 focus:bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-[#2A231F] uppercase mb-2">聯絡電話 *</label>
                      <input 
                        type="tel" 
                        required
                        placeholder="0912-345-678"
                        value={booking.phone}
                        onChange={(e) => setBooking({...booking, phone: e.target.value})}
                        className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-[#8C6D53]/50 text-sm bg-[#FDFBF7] transition-all duration-300 focus:bg-white"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <div>
                      <label className="block text-xs font-bold text-[#2A231F] uppercase mb-2">預約日期 *</label>
                      <input 
                        type="date" 
                        required
                        value={booking.date}
                        onChange={(e) => setBooking({...booking, date: e.target.value})}
                        className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-[#8C6D53]/50 text-sm bg-[#FDFBF7] transition-all duration-300 focus:bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-[#2A231F] uppercase mb-2">預約時間 *</label>
                      <select 
                        value={booking.time}
                        onChange={(e) => setBooking({...booking, time: e.target.value})}
                        className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-[#8C6D53]/50 text-sm bg-[#FDFBF7] transition-all duration-300 focus:bg-white"
                      >
                        <option value="10:30">10:30</option>
                        <option value="12:00">12:00</option>
                        <option value="14:00">14:00</option>
                        <option value="15:30">15:30</option>
                        <option value="17:00">17:00</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-[#2A231F] uppercase mb-2">用餐人數 *</label>
                      <select 
                        value={booking.guests}
                        onChange={(e) => setBooking({...booking, guests: e.target.value})}
                        className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-[#8C6D53]/50 text-sm bg-[#FDFBF7] transition-all duration-300 focus:bg-white"
                      >
                        <option value="1">1 人 (獨立座位)</option>
                        <option value="2">2 人</option>
                        <option value="3">3 人</option>
                        <option value="4">4 人</option>
                        <option value="5">5 人以上 (請電話預約)</option>

                    </div>

                    <label className="block text-xs font-bold text-[#2A231F] uppercase mb-2">特殊需求與備註</label>
                    <textarea 
                      rows="3"
                      placeholder="如有兒童椅需求或寵物同行，請在此備註..."
                      value={booking.notes}
                      onChange={(e) => setBooking({...booking, notes: e.target.value})}
                      className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-[#8C6D53]/50 text-sm bg-[#FDFBF7] transition-all duration-300 focus:bg-white"
                    ></textarea>
                  </div>

                  <button 
                    type="submit"
                    className="w-full py-4 bg-[#8C6D53] hover:bg-[#735741] text-white rounded-xl font-medium shadow-md hover:shadow-xl transition-all duration-300 hover:-translate-y-0.5 active:translate-y-0"
                  >
                    確認送出預約
                  </button>
                </form>
              )}
            </div>

                    <h2 className="text-3xl font-serif font-bold text-[#2A231F] mt-2">營業與交通聯絡</h2>
                    <div className="w-12 h-0.5 bg-[#8C6D53] mt-4"></div>
                  </div>

                  <div className="space-y-6">
                    <div className="flex items-start gap-4 p-3 rounded-xl hover:bg-white/60 transition-colors duration-300">
                      <div className="p-3 bg-white rounded-xl text-[#8C6D53] shadow-sm">
                        <Icon name="mapPin" className="w-6 h-6" />
                      </div>
                      <div>
                        <h4 className="text-sm font-bold text-[#2A231F]">門市地址</h4>

                    <div className="flex items-start gap-4 p-3 rounded-xl hover:bg-white/60 transition-colors duration-300">

                        <Icon name="clock" className="w-6 h-6" />
                      </div>
                      <div>
                        <h4 className="text-sm font-bold text-[#2A231F]">營業時間</h4>

                        <p className="text-xs text-rose-700 font-medium mt-1">每週三固定公休</p>
                      </div>
                    </div>

                    <div className="flex items-start gap-4 p-3 rounded-xl hover:bg-white/60 transition-colors duration-300">
                      <div className="p-3 bg-white rounded-xl text-[#8C6D53] shadow-sm">
                        <Icon name="phone" className="w-6 h-6" />
                      </div>
                      <div>
                        <h4 className="text-sm font-bold text-[#2A231F]">電話與 Email</h4>
                        <p className="text-sm text-[#6E5D53] mt-1">(04) 2345-6789</p>
                        <p className="text-sm text-[#6E5D53]">contact@kissicoffee.tw</p>
                      </div>
                    </div>

                    <div className="flex items-start gap-4 p-3 rounded-xl hover:bg-white/60 transition-colors duration-300">
                      <div className="p-3 bg-white rounded-xl text-[#8C6D53] shadow-sm">
                        <Icon name="info" className="w-6 h-6" />
                      </div>
                      <div>
                        <h4 className="text-sm font-bold text-[#2A231F]">交通指引與停車</h4>
                        <p className="text-sm text-[#6E5D53] mt-1">
                          【捷運】綠線「水安宮站」轉乘 300 號公車至草悟道站。<br />
                          【停車】可停至「勤美誠品地下停車場」或「市民廣場公有停車場」。
                        </p>
                      </div>
                    </div>
                  </div>
                </div>

                {/* 右側 Google Maps 嵌入 */}
                <div className="scroll-reveal opacity-0 translate-y-10 transition-all duration-700 lg:col-span-7 h-[450px] rounded-3xl overflow-hidden shadow-lg border border-[#EAE3D9] bg-stone-200 hover:shadow-2xl transition-shadow duration-500">
                  <iframe
                    title="日栖咖啡門市地圖"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3640.4284581451086!2d120.66164287604473!3d24.151838678398188!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x34693d987d6091e9%3A0x6b30f7b05fb1b15c!2zNDAyYW5n6KGXNDXomZ8!5e0!3m2!1szh-TW!2stw!4v1700000000000!5m2!1szh-TW!2stw"
                    width="100%"
                    height="100%"
                    style={{ border: 0 }}
                    allowFullScreen=""
                    loading="lazy"
                    referrerPolicy="no-referrer-when-downgrade"
                  ></iframe>
                </div>

              </div>
            </div>
          </section>

          {/* 8. 頁尾 Footer */}
          <footer className="bg-[#2A231F] text-[#D9C5B2] py-16 px-6 md:px-12 border-t border-[#3D322C]">
            <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-10">
              <div className="md:col-span-2 space-y-4">
                <a href="#" className="flex items-center gap-2.5 text-2xl font-serif font-bold text-white group">
                  <Icon name="coffee" className="w-6 h-6 text-[#8C6D53] group-hover:rotate-12 transition-transform" />
                  <span>日栖 KISSI COFFEE</span>
                </a>
                <p className="text-xs text-[#A8988B] max-w-sm leading-relaxed">
                  在慢步調的咖啡香氣中，尋找生活的質感與溫度。嚴選精品手沖與法式限定甜點。
                </p>
              </div>

              <div>
                <h4 className="text-sm font-bold text-white uppercase tracking-wider mb-4">快速連結</h4>
                <ul className="space-y-2 text-xs text-[#A8988B]">
                  <li><a href="#about" className="hover:text-white transition-colors">品牌理念</a></li>
                  <li><a href="#gallery" className="hover:text-white transition-colors">空間視覺</a></li>
                  <li><a href="#menu" className="hover:text-white transition-colors">特色菜單</a></li>
                  <li><a href="#booking" className="hover:text-white transition-colors">線上訂位</a></li>
                </ul>
              </div>

              <div>
                <h4 className="text-sm font-bold text-white uppercase tracking-wider mb-4">追蹤我們的動態</h4>
                <div className="flex gap-4">
                  <a href="#" aria-label="Instagram" className="p-2.5 bg-[#3D322C] hover:bg-[#8C6D53] text-white rounded-full transition-all duration-300 hover:scale-110">
                    <Icon name="instagram" className="w-4 h-4" />
                  </a>
                  <a href="#" aria-label="Facebook" className="p-2.5 bg-[#3D322C] hover:bg-[#8C6D53] text-white rounded-full transition-all duration-300 hover:scale-110">
                    <Icon name="facebook" className="w-4 h-4" />
                  </a>
                  <a href="mailto:contact@kissicoffee.tw" aria-label="Email" className="p-2.5 bg-[#3D322C] hover:bg-[#8C6D53] text-white rounded-full transition-all duration-300 hover:scale-110">
                    <Icon name="mail" className="w-4 h-4" />
                  </a>
                </div>
                <p className="text-xs text-[#A8988B] mt-4">IG: @kissicoffee_tw</p>
              </div>
            </div>

            <div className="max-w-6xl mx-auto border-t border-[#3D322C] mt-12 pt-8 flex flex-col sm:flex-row justify-between items-center text-xs text-[#8C7A6D]">
              <p>© 2026 KISSI COFFEE 日栖咖啡. All Rights Reserved.</p>
              <p className="mt-2 sm:mt-0">React + Tailwind CSS 互動網頁設計專案</p>
            </div>
          </footer>

          {/* 懸浮返回頂部按鈕 */}
          {showBackToTop && (
            <button
              onClick={scrollToTop}
              className="fixed bottom-6 right-6 z-40 p-3 bg-[#8C6D53] hover:bg-[#735741] text-white rounded-full shadow-lg hover:shadow-2xl transition-all duration-300 hover:-translate-y-1 active:translate-y-0"
              aria-label="返回頂部"
            >
              <Icon name="arrowUp" className="w-5 h-5" />
            </button>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
